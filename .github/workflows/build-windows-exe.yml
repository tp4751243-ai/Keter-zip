name: Build Windows EXE

# Builds the Keter Typesetter desktop app on a Windows runner and publishes
# the NSIS installer (.exe) on a GitHub Release (tag v<version>). Releases
# have no artifact-storage quota, so this never fails the way artifact
# uploads did. No signing yet, so Windows SmartScreen may show a warning
# on first install — that is expected for an unsigned installer.
on:
  workflow_dispatch:
  push:
    # react = the original development branch; claude/confident-brown-d95gce
    # = this repository's default branch (holds the layout-training work).
    branches: [react, claude/confident-brown-d95gce]
    paths:
      - 'electron/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'index.html'
      - 'public/fonts/**'
      - 'scripts/training/**'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  # Layout-rule gate: no installer is built when a sefer type gets another
  # type's rules (sefer-type audit), or the book / Word export rules break.
  layout-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Sefer-type isolation audit (every type gets only its own rules)
        run: npx tsx scripts/training/sefer-type-audit.ts
      - name: Right-bound book rules
        run: npx tsx scripts/training/book-rules-test.ts
      - name: Word export RTL rules
        run: npx tsx scripts/training/word-rtl-test.ts
      - name: Word import picks the right sefer type (Chumash is never a Gemara)
        run: npx tsx scripts/training/import-classifier-test.ts
      - name: Two-column Chassidic sefer (Kedushat Levi prints)
        run: npx tsx scripts/training/two-column-sefer-test.ts
      - name: Talmud amud pages (each דף heading starts a page; Vilna page shape)
        run: npx tsx scripts/training/amud-page-test.ts
      - name: Mikraot Gedolot page rules (Devarim 1–2)
        run: npx tsx scripts/training/chumash-harness.ts deuteronomy --no-render --min-score 100
      - name: Brace-tagged prose sefer (Mesilat Yesharim, two columns)
        run: npx tsx scripts/training/prose-harness.ts --no-render --min-score 100
      - name: Whole-book import (Bereishit + Onkelos + Rashi) — no freeze, links correct
        run: TRUTH=training/chumash/genesis/corpus.json MIN_ACCURACY=0.95 npx tsx scripts/training/import-perf.ts training/chumash/genesis/docx --budget-ms 60000

  build-windows:
    needs: layout-rules
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }

      - name: Build the web app
        run: npm run build

      - name: Build the Windows installer
        run: npm run desktop:build

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Keter Typesetter v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*.exe
